name: Python ETL CI

on:
  push:
  pull_request:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test ETL CLI
        run: python -m pipeline.cli --input data/sample_orders.csv --db output/retail.db --rejects output/rejected_rows.csv
