name: Log analytics tests

on:
  push:
    paths:
      - "projects/02-log-analytics/**"
      - ".github/workflows/log_analytics.yml"
  pull_request:
    paths:
      - "projects/02-log-analytics/**"
      - ".github/workflows/log_analytics.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s projects/02-log-analytics/tests -v
      - name: Smoke-test CLI
        run: |
          python projects/02-log-analytics/log_analytics.py ingest --input projects/02-log-analytics/data/sample_logs.jsonl --db output/log.db
          python projects/02-log-analytics/log_analytics.py report --db output/log.db --output output/report.json
          python -c "import json; assert json.load(open('output/report.json'))['total_requests'] == 8"
